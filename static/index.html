<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Creator Content Radar</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e0e12;--bg2:#16161d;--bg3:#1e1e28;--bg4:#2a2a38;--text:#f1f1f1;--text2:#a0a0b0;--text3:#6b6b80;--primary:#ff4444;--primary-hover:#ff6666;--accent:#3b82f6;--accent-hover:#60a5fa;--success:#22c55e;--warning:#f59e0b;--error:#ef4444;--border:#2a2a38;--radius:12px;--shadow:0 8px 32px rgba(0,0,0,.5);--sidebar-w:260px;--header-h:60px}
[data-theme=light]{--bg:#f5f5f8;--bg2:#fff;--bg3:#f0f0f4;--bg4:#e5e5ea;--text:#0f0f0f;--text2:#555;--text3:#888;--border:#e5e5ea;--shadow:0 2px 12px rgba(0,0,0,.06)}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#root{min-height:100vh}
.app-layout{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:#0c0c14;border-right:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.sidebar-logo{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.04);font-weight:800;font-size:1rem;flex-shrink:0;letter-spacing:-.02em;color:#fff}
.sidebar-logo svg{width:22px;height:22px;color:var(--primary);transition:transform .3s}
.sidebar-logo:hover svg{transform:rotate(-6deg) scale(1.1)}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-section{padding:14px 14px 6px;font-size:.7rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 14px;color:var(--text2);text-decoration:none;font-size:.86rem;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit;position:relative;border-radius:8px}
.nav-item:hover{background:rgba(255,255,255,.04);color:#fff}
.nav-item.active{background:rgba(59,130,246,.12);color:#60a5fa;font-weight:600}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.5;transition:all .15s}
.nav-item.active svg,.nav-item:hover svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:.62rem;padding:2px 7px;border-radius:999px;font-weight:600;min-width:18px;text-align:center}
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* Topbar */
.topbar{height:var(--header-h);background:rgba(14,14,18,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;flex-shrink:0;position:sticky;top:0;z-index:99}
.topbar-search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:0 14px;transition:all .25s}
.topbar-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.topbar-search input{flex:1;padding:9px 0;background:none;border:none;color:var(--text);font-family:inherit;font-size:.88rem;outline:none}
.topbar-search input::placeholder{color:var(--text3)}
.topbar-actions{display:flex;gap:4px;align-items:center}
.icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:none;color:var(--text2);cursor:pointer;transition:all .15s;font-size:1.05rem}
.icon-btn:hover{background:var(--bg3);color:var(--text)}

/* Page transitions */
.page-content{padding:32px 40px;flex:1;animation:pageIn .4s cubic-bezier(.16,1,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;transition:all .25s}
.card:hover{border-color:var(--bg4);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-header h2,.card-header h3{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:default;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:opacity .25s}
.stat:hover::before{opacity:1}
.stat:hover{border-color:var(--bg4);box-shadow:var(--shadow)}
.stat .label{font-size:.72rem;color:var(--text3);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .value{font-size:1.7rem;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.stat .change{font-size:.78rem;font-weight:600;margin-top:6px;color:var(--text2)}

/* Charts */
.chart-container{position:relative;height:250px;width:100%}
.chart-container-sm{height:180px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* Menu toggle */
.menu-toggle{display:none}

/* ── Responsive ─────────────────────────────────── */
@media(max-width:1024px){
  .page-content{padding:24px 28px}
}
@media(max-width:900px){
  .chart-grid{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main-area{margin-left:0}
  .page-content{padding:20px 24px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .menu-toggle{display:flex!important}
  .topbar{padding:0 20px}
  .topbar-search{max-width:280px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;gap:0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:11px 16px;white-space:nowrap;flex-shrink:0}
  .stat .value{font-size:1.3rem}
}
@media(max-width:600px){
  .page-content{padding:16px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:14px}
  .stat .value{font-size:1.15rem}
  .stat .label{font-size:.7rem}
  .card{padding:18px}
  .card-header{margin-bottom:12px}
  .sidebar-logo{padding:0 16px}
  .nav-item{padding:9px 12px;font-size:.84rem}
  .nav-item svg{width:18px;height:18px}
  .content-item{padding:12px;flex-wrap:wrap}
  .btn{padding:9px 18px;font-size:.82rem}
  .input{padding:10px 14px;font-size:.85rem}
  .topbar-search{max-width:180px}
  .empty-state{padding:40px 16px}
  .empty-state .emoji{font-size:2.4rem}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr;gap:6px}
  .page-content{padding:12px}
  .topbar-search{max-width:130px}
  .topbar-search input{font-size:.82rem}
  .topbar-actions{gap:2px}
  .icon-btn{width:32px;height:32px;font-size:1rem}
  .card{padding:14px}
}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
.tab{padding:11px 24px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;margin-bottom:-1px}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--text);border-bottom-color:var(--primary)}
.tab-count{padding:2px 8px;background:var(--bg3);border-radius:999px;font-size:.68rem;margin-left:8px;color:var(--text2);font-weight:500}
.tab-panel{display:none}.tab-panel.active{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Content list */
.content-list{display:flex;flex-direction:column;gap:8px}
.content-item{display:flex;gap:14px;padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;transition:all .2s;cursor:pointer}
.content-item:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.platform-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.tag{display:inline-flex;padding:3px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;font-size:.76rem;color:var(--text2);margin:2px;transition:all .15s;font-weight:500}
.tag:hover{border-color:var(--text3)}

/* Inputs */
.input{width:100%;padding:11px 16px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none;transition:all .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.input:hover{border-color:var(--bg4)}

/* Buttons */
.btn{padding:10px 22px;border:none;border-radius:10px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);box-shadow:0 4px 16px rgba(255,68,68,.25)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-hover);box-shadow:0 4px 16px rgba(59,130,246,.25)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid rgba(255,255,255,.08)}.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* Loading */
.skeleton{background:var(--bg3);border-radius:8px;animation:pulse 2s ease-in-out infinite;margin-bottom:8px;min-height:16px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.loading-bar{width:100%;height:3px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0}
.loading-bar.active{display:block}
.loading-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:4px;animation:slide 1.4s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}350%{transform:translateX(350%)}}

/* Error / Empty / Insight */
.error-box{display:none;padding:10px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:10px;color:var(--error);font-size:.85rem;margin:8px 0;line-height:1.5}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.empty-state{text-align:center;padding:64px 20px;color:var(--text3)}
.empty-state .emoji{font-size:3rem;margin-bottom:16px;opacity:.3}
.empty-state h2{font-size:1.2rem;font-weight:700;margin-bottom:8px;color:var(--text2)}
.empty-state p{font-size:.88rem;color:var(--text3);line-height:1.7;max-width:400px;margin:0 auto}
.insight{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.insight h3{font-size:.9rem;color:var(--accent);margin-bottom:8px;font-weight:700}
.insight p{color:var(--text2);font-size:.88rem;line-height:1.7}

/* Auth */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg);position:relative}
.auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,68,68,.04) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(59,130,246,.04) 0%,transparent 50%);pointer-events:none}
.auth-card{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:44px;position:relative;animation:pageIn .4s ease}
.auth-card h1{font-size:1.4rem;margin-bottom:6px;font-weight:800;letter-spacing:-.02em}
.auth-card .subtitle{color:var(--text3);font-size:.9rem;margin-bottom:28px}
.auth-card .error{color:var(--error);font-size:.85rem;margin-bottom:16px;padding:10px 14px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius)}

/* Form */
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:.75rem;font-weight:700;color:var(--text3);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}

/* Competitor grid */
.competitor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.competitor-card{padding:16px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .2s}
.competitor-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.competitor-card .name{font-weight:700;color:var(--text);margin-bottom:4px;font-size:.93rem}
.competitor-card .note{font-size:.8rem;color:var(--text3);line-height:1.5}
.competitor-card .subs{font-size:.78rem;color:var(--accent);margin-top:8px;font-weight:600}

/* Rec list */
.rec-list{list-style:none}
.rec-list li{padding:8px 0 8px 24px;position:relative;color:var(--text2);font-size:.88rem;border-bottom:1px solid var(--border);transition:all .2s;line-height:1.5}
.rec-list li:hover{padding-left:28px;color:var(--text)}
.rec-list li:last-child{border-bottom:none}
.rec-list li::before{content:'\2192';position:absolute;left:0;color:var(--primary);font-weight:700;transition:left .2s}
.rec-list li:hover::before{left:4px}

/* Toast */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:.85rem;font-weight:500;pointer-events:auto;animation:toastIn .3s cubic-bezier(.16,1,.3,1);max-width:360px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.toast.success{background:var(--success);color:#fff}
.toast.error{background:var(--error);color:#fff}
.toast.info{background:var(--accent);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/app.js"></script>
</body>
</html>
