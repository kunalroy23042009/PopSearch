<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PopSearch — AI YouTube Analytics</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg-surface:#13131a;--bg-elevated:#1c1c26;--bg-sidebar:#08080d;--bg-input:#1a1a24;--text:#f5f5f7;--text-2:#a0a0b0;--text-3:#6b6b80;--primary:#ff2d55;--primary-hover:#ff476b;--primary-muted:rgba(255,45,85,.12);--accent:#3b82f6;--accent-hover:#60a5fa;--accent-muted:rgba(59,130,246,.12);--success:#22c55e;--warning:#f59e0b;--error:#ef4444;--border:rgba(255,255,255,.06);--border-strong:rgba(255,255,255,.12);--shadow-sm:0 2px 8px rgba(0,0,0,.3);--shadow-md:0 8px 24px rgba(0,0,0,.4);--shadow-lg:0 16px 48px rgba(0,0,0,.5);--shadow-glow:0 0 24px rgba(255,45,85,.15);--radius:14px;--radius-sm:10px;--radius-lg:20px;--sidebar-w:248px;--header-h:56px;--transition:0.2s cubic-bezier(0.4,0,0.2,1)}
[data-theme=light]{--bg:#f7f8fa;--bg-surface:#fff;--bg-elevated:#f0f1f4;--bg-sidebar:#fff;--bg-input:#f5f6f8;--text:#1a1a2e;--text-2:#6b6b80;--text-3:#9ca3af;--border:rgba(0,0,0,.07);--border-strong:rgba(0,0,0,.12);--shadow-sm:0 1px 3px rgba(0,0,0,.04);--shadow-md:0 4px 16px rgba(0,0,0,.08);--shadow-lg:0 12px 32px rgba(0,0,0,.1);--shadow-glow:0 0 24px rgba(255,45,85,.08)}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.5}
#root{min-height:100vh}.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar-logo{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);font-weight:800;font-size:1.05rem;flex-shrink:0}
.sidebar-logo svg{width:22px;height:22px;color:var(--primary)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.nav-section{padding:14px 12px 6px;font-size:.68rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--text-2);cursor:pointer;font-size:.82rem;font-weight:500;border:none;background:none;width:100%;text-align:left;font-family:inherit;border-radius:10px;transition:all .15s;position:relative}
.nav-item:hover{background:var(--bg-elevated);color:var(--text)}
.nav-item.active{background:var(--primary-muted);color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:.6rem;padding:2px 7px;border-radius:999px;font-weight:600}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.plan-badge{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-elevated);border-radius:10px;font-size:.75rem}
.plan-badge .plan-name{font-weight:600;color:var(--text-2)}
.plan-badge .upgrade{color:var(--primary);font-weight:600;cursor:pointer}
.topbar{height:var(--header-h);background:rgba(10,10,15,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:99}
.topbar-search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:rgba(26,26,36,.6);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;padding:0 14px;transition:all .2s}
.topbar-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-muted)}
.topbar-search input{flex:1;padding:9px 0;background:none;border:none;color:var(--text);font-size:.82rem;font-family:inherit;outline:none}
.topbar-search input::placeholder{color:var(--text-3)}
.topbar-actions{display:flex;gap:4px;align-items:center;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:10px;border:none;background:none;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:1.05rem}
.icon-btn:hover{background:var(--bg-elevated);color:var(--text)}
.menu-toggle{display:none}
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.page-content{padding:32px 40px;flex:1;animation:pageIn .4s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;transition:all .2s}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-header h2,.card-header h3{font-size:1rem;font-weight:700}
.card-header .card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
.card-body{color:var(--text-2);font-size:.92rem;line-height:1.6}
.card-footer{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all .2s;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:opacity .25s}
.stat:hover::before{opacity:1}
.stat:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
.stat .label{font-size:.68rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px}
.stat .value{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .change{font-size:.75rem;font-weight:600;margin-top:6px}
.stat .change.up{color:var(--success)}
.stat .change.down{color:var(--error)}
.chart-container{position:relative;height:280px;width:100%}
.chart-container-sm{height:200px}
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 24px;border-radius:10px;font-weight:600;font-size:.85rem;border:none;cursor:pointer;font-family:inherit;transition:all .2s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,#ff2d55,#ff476b);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-glow)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn-secondary:hover{background:var(--bg-elevated)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-hover)}
.btn-ghost{background:transparent;color:var(--text-2);padding:8px 16px}
.btn-ghost:hover{color:var(--text);background:var(--bg-elevated)}
.btn-lg{padding:14px 32px;font-size:.95rem}
.btn-sm{padding:6px 14px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:.88rem;font-family:inherit;transition:all .2s}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-muted)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text-2);margin-bottom:6px}
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--text-3);padding:12px 16px;border-bottom:1px solid var(--border)}
.table td{padding:14px 16px;font-size:.88rem;color:var(--text);border-bottom:1px solid var(--border)}
.table tr:hover td{background:var(--bg-elevated)}
.table .num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-primary{background:var(--primary-muted);color:var(--primary);border:1px solid rgba(255,45,85,.25)}
.badge-accent{background:var(--accent-muted);color:var(--accent);border:1px solid rgba(59,130,246,.25)}
.badge-success{background:rgba(34,197,94,.12);color:var(--success);border:1px solid rgba(34,197,94,.25)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--warning);border:1px solid rgba(245,158,11,.25)}
.badge-error{background:rgba(239,68,68,.12);color:var(--error);border:1px solid rgba(239,68,68,.25)}
.progress-bar{width:100%;height:8px;background:var(--bg-elevated);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s ease}
.progress-fill.success{background:var(--success)}
.progress-fill.warning{background:var(--warning)}
.progress-fill.error{background:var(--error)}
.tag{display:inline-flex;padding:4px 12px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:999px;font-size:.72rem;color:var(--text-2);margin:2px;font-weight:500;transition:all .15s}
.tag:hover{border-color:var(--text-3)}
.skeleton{background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-surface) 50%,var(--bg-elevated) 75%);background-size:200% 100%;border-radius:8px;animation:shimmer 1.5s ease-in-out infinite;margin-bottom:8px;min-height:16px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:12px;font-size:.85rem;font-weight:500;pointer-events:auto;animation:toastIn .3s ease;max-width:380px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);box-shadow:var(--shadow-md)}
.toast.success{background:rgba(34,197,94,.9);color:#fff}
.toast.error{background:rgba(239,68,68,.9);color:#fff}
.toast.info{background:rgba(59,130,246,.9);color:#fff}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{text-align:center;padding:64px 24px;color:var(--text-3)}
.empty-state .emoji{font-size:3.5rem;margin-bottom:16px;opacity:.35}
.empty-state h2{font-size:1.25rem;font-weight:700;margin-bottom:8px;color:var(--text-2)}
.empty-state p{font-size:.92rem;max-width:400px;margin:0 auto 20px;line-height:1.6}
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);color:var(--error);padding:12px 16px;border-radius:10px;font-size:.88rem;margin-bottom:16px;animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:24px;gap:0;overflow-x:auto}
.tab{padding:12px 24px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-3);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text-2)}
.tab.active{color:var(--text);border-bottom-color:var(--primary)}
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,45,85,.06) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(59,130,246,.06) 0%,transparent 50%)}
.auth-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:20px;padding:40px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);position:relative;z-index:1}
.auth-card h1{font-size:1.5rem;font-weight:700;margin-bottom:4px}
.auth-card .subtitle{color:var(--text-2);font-size:.88rem;margin-bottom:28px}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text-3);font-size:.82rem}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.content-list{display:flex;flex-direction:column;gap:8px}
.content-item{display:flex;gap:14px;padding:14px;background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;text-decoration:none;color:inherit;transition:all .15s;cursor:pointer}
.content-item:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.platform-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gradient-text{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.section-title{font-size:1.25rem;font-weight:700;margin-bottom:16px}
.muted{color:var(--text-2)}
.muted-2{color:var(--text-3)}
.flex{display:flex}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.mt-2{margin-top:8px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.text-sm{font-size:.82rem}.text-xs{font-size:.68rem}
@media(max-width:1024px){.grid-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1024px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.menu-toggle{display:flex}.main-area{margin-left:0}}
@media(max-width:768px){.chart-grid,.chart-grid-2{grid-template-columns:1fr}.grid-2,.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr}}
@media(max-width:640px){.stats{grid-template-columns:1fr}.page-content{padding:20px 16px}.topbar{padding:0 16px}.topbar-search{max-width:200px}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg-elevated);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}
</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
