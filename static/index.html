<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PopSearch — AI YouTube Analytics</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>(async()=>{try{const r=await fetch('/api/auth/google/client-id');if(r.ok){const d=await r.json();window.__GOOGLE_CLIENT_ID__=d.client_id||'';}}catch(e){}})();</script>
<script defer src="/static/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0f0f0f;--bg-surface:#1a1a1a;--bg-elevated:#222222;--bg-sidebar:#0a0a0a;--bg-input:#1a1a1a;
--text:#f1f1f1;--text-2:#aaaaaa;--text-3:#717171;
--primary:#3ea6ff;--primary-hover:#5bb8ff;--primary-muted:rgba(62,166,255,.12);
--accent:#ff2d55;--accent-hover:#ff476b;--accent-muted:rgba(255,45,85,.12);
--success:#2dba4e;--warning:#f59e0b;--error:#ef4444;
--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
--shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 16px rgba(0,0,0,.4);--shadow-lg:0 12px 40px rgba(0,0,0,.5);
--radius:12px;--radius-sm:8px;--radius-lg:16px;--radius-xl:24px;
--sidebar-w:240px;--header-h:56px;
--transition:.18s cubic-bezier(.4,0,.2,1);
--font-ui:'Inter',-apple-system,sans-serif;
--font-head:'Roboto',-apple-system,sans-serif;
}
[data-theme=light]{
--bg:#f9f9f9;--bg-surface:#fff;--bg-elevated:#f0f0f0;--bg-sidebar:#fff;--bg-input:#f5f5f5;
--text:#0f0f0f;--text-2:#606060;--text-3:#909090;
--border:rgba(0,0,0,.08);--border-strong:rgba(0,0,0,.14);
--shadow-sm:0 1px 2px rgba(0,0,0,.04);--shadow-md:0 4px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 24px rgba(0,0,0,.1);
--primary-muted:rgba(62,166,255,.08);--accent-muted:rgba(255,45,85,.08);
}
html{font-size:16px}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--font-head);letter-spacing:-.01em}
#root{min-height:100vh}

/* ── Layout ── */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;transition:transform var(--transition)}
.sidebar-logo{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);font-weight:800;font-size:1.1rem;flex-shrink:0;font-family:var(--font-head)}
.sidebar-logo svg{width:24px;height:24px;color:var(--primary)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
.nav-section{padding:20px 12px 8px;font-size:.72rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.12em}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--text-2);cursor:pointer;font-size:.92rem;font-weight:500;border:none;background:none;width:100%;text-align:left;font-family:inherit;border-radius:8px;transition:all var(--transition);position:relative;margin-bottom:2px}
.nav-item:hover{background:var(--bg-elevated);color:var(--text)}
.nav-item.active{background:var(--primary-muted);color:var(--primary);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px;border-top:1px solid var(--border)}
.plan-badge{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg-elevated);border-radius:10px;font-size:.88rem;border:1px solid var(--border)}
.plan-badge .plan-name{font-weight:700;color:var(--text-2);display:flex;align-items:center;gap:6px}
.plan-badge .plan-name svg{width:14px;height:14px;color:var(--primary)}
.plan-badge .upgrade{color:var(--primary);font-weight:600;cursor:pointer;font-size:.75rem}
.plan-badge .upgrade:hover{text-decoration:underline}

/* ── Topbar ── */
.topbar{height:var(--header-h);background:rgba(15,15,15,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;position:sticky;top:0;z-index:99}
.topbar-search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;padding:0 12px;transition:all var(--transition)}
.topbar-search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-muted)}
.topbar-search svg{width:16px;height:16px;color:var(--text-3);flex-shrink:0}
.topbar-search input{flex:1;padding:8px 0;background:none;border:none;color:var(--text);font-size:.85rem;font-family:inherit;outline:none}
.topbar-search input::placeholder{color:var(--text-3)}
.topbar-actions{display:flex;gap:2px;align-items:center;margin-left:auto}
.icon-btn{width:36px;height:36px;border-radius:8px;border:none;background:none;color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--transition)}
.icon-btn:hover{background:var(--bg-elevated);color:var(--text)}
.icon-btn svg{width:18px;height:18px}
.menu-toggle{display:none}
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.page-content{padding:28px 32px;flex:1;animation:pageIn .3s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── Cards ── */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;transition:border-color var(--transition)}
.card:hover{border-color:var(--border-strong)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-header h2,.card-header h3{font-size:1.1rem;font-weight:700}
.card-header .card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--primary-muted)}
.card-header .card-icon svg{width:20px;height:20px;color:var(--primary)}
.card-body{color:var(--text-2);font-size:1rem;line-height:1.7}
.card-footer{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all var(--transition);position:relative;overflow:hidden}
.stat:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat .label{font-size:.78rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.stat .label svg{width:14px;height:14px}
.stat .value{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-family:var(--font-head)}
.stat .change{font-size:.75rem;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:4px}
.stat .change.up{color:var(--success)}
.stat .change.down{color:var(--error)}

/* ── Charts ── */
.chart-container{position:relative;height:280px;width:100%}
.chart-container-sm{height:200px}
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.chart-grid,.chart-grid-2{grid-template-columns:1fr}}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:8px;font-weight:600;font-size:.92rem;border:none;cursor:pointer;font-family:inherit;transition:all var(--transition);text-decoration:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#0f0f0f}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(62,166,255,.25)}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border-strong)}
.btn-secondary:hover{background:var(--bg-elevated);border-color:var(--text-3)}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:var(--accent-hover);transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--text-2);padding:8px 16px}
.btn-ghost:hover{color:var(--text);background:var(--bg-elevated)}
.btn-lg{padding:14px 28px;font-size:.95rem}
.btn-sm{padding:6px 14px;font-size:.78rem}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.btn .spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:currentColor;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Forms ── */
.input{width:100%;padding:12px 16px;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-family:inherit;transition:all var(--transition)}
.input::placeholder{color:var(--text-3)}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-muted)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.88rem;font-weight:600;color:var(--text-2);margin-bottom:8px}
textarea.input{resize:vertical;min-height:80px}

/* ── Tables ── */
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:.65rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-3);padding:12px 16px;border-bottom:1px solid var(--border)}
.table td{padding:14px 16px;font-size:.88rem;color:var(--text);border-bottom:1px solid var(--border)}
.table tr:hover td{background:var(--bg-elevated)}
.table .num{text-align:right;font-variant-numeric:tabular-nums}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-primary{background:var(--primary-muted);color:var(--primary)}
.badge-accent{background:var(--accent-muted);color:var(--accent)}
.badge-success{background:rgba(43,186,78,.12);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.12);color:var(--warning)}
.badge-error{background:rgba(239,68,68,.12);color:var(--error)}
.badge-neutral{background:var(--bg-elevated);color:var(--text-2)}

/* ── Toasts ── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:.88rem;font-weight:500;display:flex;align-items:center;gap:8px;animation:toastIn .3s ease;backdrop-filter:blur(20px);box-shadow:var(--shadow-md)}
.toast.success{background:rgba(43,186,78,.15);border:1px solid rgba(43,186,78,.3);color:var(--success)}
.toast.error{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:var(--error)}
.toast.info{background:rgba(62,166,255,.15);border:1px solid rgba(62,166,255,.3);color:var(--primary)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── Skeletons ── */
.skeleton{background:linear-gradient(90deg,var(--bg-elevated) 25%,var(--bg-surface) 50%,var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Error Box ── */
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:12px 16px;color:var(--error);font-size:.85rem;font-weight:500}

/* ── Empty State ── */
.empty-state{text-align:center;padding:48px 24px}
.empty-state .empty-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center}
.empty-state .empty-icon svg{width:28px;height:28px;color:var(--text-3)}
.empty-state h2{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.empty-state p{color:var(--text-3);font-size:.88rem;max-width:340px;margin:0 auto 20px}

/* ── Auth Pages ── */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--bg)}
.auth-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px;max-width:440px;width:100%;box-shadow:var(--shadow-lg)}
.auth-card .auth-logo{width:48px;height:48px;border-radius:12px;background:var(--primary-muted);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.auth-card .auth-logo svg{width:24px;height:24px;color:var(--primary)}
.auth-card h1{font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:8px}
.auth-card .subtitle{text-align:center;color:var(--text-3);font-size:1rem;margin-bottom:28px}
.auth-divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.auth-divider-line{flex:1;height:1px;background:var(--border)}
.auth-divider-text{font-size:.78rem;color:var(--text-3);white-space:nowrap}
.auth-link{text-align:center;margin-top:20px;font-size:.85rem;color:var(--text-3)}
.auth-link a{color:var(--primary);text-decoration:none;font-weight:600}
.auth-link a:hover{text-decoration:underline}

/* ── Content Items ── */
.content-item{display:flex;gap:14px;padding:14px;border-radius:10px;background:var(--bg-surface);border:1px solid var(--border);text-decoration:none;color:inherit;transition:all var(--transition);margin-bottom:8px}
.content-item:hover{border-color:var(--border-strong);background:var(--bg-elevated)}
.platform-badge{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex-shrink:0}

/* ── Progress Bar ── */
.progress-bar{height:6px;background:var(--bg-elevated);border-radius:3px;overflow:hidden}
.progress-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.progress-bar-fill.success{background:var(--success)}
.progress-bar-fill.warning{background:var(--warning)}
.progress-bar-fill.error{background:var(--error)}
.progress-bar-fill.primary{background:var(--primary)}

/* ── Tooltip / Info ── */
.info-tip{font-size:.78rem;color:var(--text-3);padding:10px 14px;background:var(--bg-elevated);border-radius:8px;border:1px solid var(--border);margin-top:12px}

/* ── Section heading ── */
.section-title{font-size:1.3rem;font-weight:800;margin-bottom:4px;font-family:var(--font-head)}
.section-subtitle{color:var(--text-3);font-size:1rem;margin-bottom:24px}

/* ── Responsive ── */
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.menu-toggle{display:flex}
.main-area{margin-left:0}
.page-content{padding:20px 16px}
.stats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chart-grid,.chart-grid-2{grid-template-columns:1fr}
}
.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* ── Misc ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:768px){.grid-2,.grid-3{grid-template-columns:1fr}}
.flex{display:flex}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.mb-8{margin-bottom:8px}.mb-16{margin-bottom:16px}.mb-24{margin-bottom:24px}
.mt-8{margin-top:8px}.mt-16{margin-top:16px}.mt-24{margin-top:24px}
.text-sm{font-size:.82rem}.text-xs{font-size:.72rem}
.text-muted{color:var(--text-3)}.text-2{color:var(--text-2)}
.text-center{text-align:center}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}
.w-full{width:100%}
.rounded{border-radius:var(--radius)}
.p-16{padding:16px}.p-20{padding:20px}.p-24{padding:24px}
.border{border:1px solid var(--border);border-radius:var(--radius)}
.opacity-60{opacity:.6}

.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-surface);color:var(--text);font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.google-btn:hover{background:var(--bg-elevated);border-color:var(--text-3)}
.google-btn svg{width:18px;height:18px}
.google-btn:disabled{opacity:.5;cursor:not-allowed}
.google-loading{display:flex;align-items:center;justify-content:center;padding:12px;gap:8px;color:var(--text-3);font-size:.9rem}

</style>
</head>
<body>
<div id="root"></div>
</body>
</html>
