<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Creator Content Radar</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN SYSTEM — Creator Content Radar
   Inspired by SimilarWeb polish × YouTube Studio
   ══════════════════════════════════════════════ */

/* ── 0. Reset ────────────────────────────────── */
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

/* ── 1. Color Palette + Typography + Spacing ── */
:root{
  /* Dark mode */
  --bg:#0e0e12;--bg2:#16161d;--bg3:#1e1e28;--bg4:#2a2a38;
  --text:#f1f1f1;--text2:#a0a0b0;--text3:#6b6b80;
  --primary:#ff2d55;--primary-hover:#ff476b;
  --accent:#3b82f6;--accent-hover:#60a5fa;
  --success:#22c55e;--warning:#f59e0b;--error:#ef4444;
  --border:#2a2a38;--radius:12px;
  --shadow:0 8px 32px rgba(0,0,0,.5);
  --sidebar-w:260px;--header-h:60px;
  /* Typography scale (rem) */
  --text-xs:.68rem;--text-sm:.82rem;--text-base:.92rem;--text-md:1rem;
  --text-lg:1.15rem;--text-xl:1.35rem;--text-2xl:1.75rem;--text-3xl:2.2rem;
  /* Spacing (rem) */
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
}
[data-theme=light]{
  --bg:#f5f5f8;--bg2:#fff;--bg3:#f0f0f4;--bg4:#e5e5ea;
  --text:#0f0f0f;--text2:#555;--text3:#888;
  --border:#e5e5ea;
  --shadow:0 2px 12px rgba(0,0,0,.06);
}

/* ── 2. Typography ──────────────────────────── */
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:16px;line-height:1.5}
.gradient-text{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto}
.emoji-3d{filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));transform:perspective(1px) translateZ(0);display:inline-block;line-height:1}
#root{min-height:100vh}
.app-layout{display:flex;min-height:100vh}

/* ── 3. Sidebar ─────────────────────────────── */
.sidebar{width:var(--sidebar-w);background:#0c0c14;border-right:1px solid rgba(255,255,255,.04);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .35s cubic-bezier(.22,1,.36,1)}
.sidebar-logo{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.04);font-weight:800;font-size:var(--text-md);flex-shrink:0;letter-spacing:-.02em;color:#fff}
.sidebar-logo svg{width:22px;height:22px;color:var(--primary);transition:transform .3s}
.sidebar-logo:hover svg{transform:rotate(-6deg) scale(1.1)}
.sidebar-nav{flex:1;overflow-y:auto;padding:var(--space-3) var(--space-2)}
.nav-section{padding:var(--space-4) var(--space-3) var(--space-2);font-size:var(--text-xs);font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;color:var(--text2);text-decoration:none;font-size:var(--text-sm);font-weight:500;cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:inherit;border-radius:8px}
.nav-item:hover{background:rgba(255,255,255,.04);color:#fff}
.nav-item.active{background:rgba(59,130,246,.12);color:#60a5fa;font-weight:600}
.nav-item .nav-icon{width:18px;height:18px;flex-shrink:0;opacity:.5;transition:all .12s;display:inline-flex;align-items:center;justify-content:center}
.nav-item.active .nav-icon,.nav-item:hover .nav-icon{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:.62rem;padding:2px 7px;border-radius:999px;font-weight:600;min-width:18px;text-align:center}
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}

/* ── 4. Frosted Glass Topbar ────────────────── */
.topbar{height:var(--header-h);background:rgba(14,14,18,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 var(--space-8);gap:var(--space-4);flex-shrink:0;position:sticky;top:0;z-index:99}
.topbar-search{flex:1;max-width:400px;display:flex;align-items:center;gap:8px;background:rgba(30,30,40,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;padding:0 14px;transition:all .25s}
.topbar-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.topbar-search input{flex:1;padding:9px 0;background:none;border:none;color:var(--text);font-size:var(--text-sm);font-family:inherit;outline:none}
.topbar-search input::placeholder{color:var(--text3)}
.topbar-actions{display:flex;gap:4px;align-items:center}
.icon-btn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:none;background:none;color:var(--text2);cursor:pointer;transition:all .12s;font-size:1.05rem}
.icon-btn:hover{background:var(--bg3);color:var(--text)}

/* ── 5. Page Transitions ────────────────────── */
.page-content{padding:var(--space-8) var(--space-10);flex:1;animation:pageIn .4s cubic-bezier(.16,1,.3,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── 6. Cards ───────────────────────────────── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-6);margin-bottom:var(--space-4);transition:all .2s}
.card:hover{border-color:var(--bg4);box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:var(--space-4)}
.card-header h2,.card-header h3{font-size:var(--text-md);font-weight:700;letter-spacing:-.01em}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.card-body{color:var(--text2);font-size:var(--text-base);line-height:1.6}
.card-footer{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--border)}

/* ── 7. KPI Stat Tiles (SimilarWeb style) ──── */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:var(--space-3);margin-bottom:var(--space-6)}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:var(--space-5);transition:all .2s;cursor:default;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:0;transition:opacity .25s}
.stat:hover::before{opacity:1}
.stat:hover{border-color:var(--bg4);box-shadow:var(--shadow)}
.stat .label{font-size:var(--text-xs);color:var(--text3);margin-bottom:var(--space-1);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.stat .value{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.2}
.stat .change{font-size:var(--text-sm);font-weight:600;margin-top:var(--space-1);color:var(--text2)}

/* ── 8. Charts ──────────────────────────────── */
.chart-container{position:relative;height:260px;width:100%}
.chart-container-sm{height:180px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}

/* ── 9. Menu Toggle ─────────────────────────── */
.menu-toggle{display:none}

/* ── 10. Tabs ───────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:var(--space-6);flex-wrap:wrap}
.tab{padding:12px 24px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:var(--text-sm);font-weight:600;cursor:pointer;transition:all .12s;font-family:inherit;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--text);border-bottom-color:var(--primary)}
.tab-count{padding:2px 8px;background:var(--bg3);border-radius:999px;font-size:.68rem;margin-left:8px;color:var(--text2);font-weight:500}
.tab-panel{display:none}.tab-panel.active{display:block;animation:panelIn .25s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── 11. Content Items / Tables ─────────────── */
.content-list{display:flex;flex-direction:column;gap:var(--space-2)}
.content-item{display:flex;gap:14px;padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;transition:all .15s;cursor:pointer;font-size:var(--text-base)}
.content-item:hover{border-color:var(--accent);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.platform-badge{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.tag{display:inline-flex;padding:4px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;font-size:var(--text-xs);color:var(--text2);margin:2px;transition:all .12s;font-weight:500}
.tag:hover{border-color:var(--text3)}

/* ── 12. Inputs (Glassmorphism) ─────────────── */
.input{width:100%;padding:12px 18px;background:rgba(30,30,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:var(--text-base);font-family:inherit;outline:none;transition:all .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.12)}
.input:hover{border-color:var(--bg4)}

/* ── 13. Buttons ────────────────────────────── */
.btn{padding:11px 24px;border:none;border-radius:10px;font-weight:600;font-size:var(--text-sm);cursor:pointer;font-family:inherit;transition:all .12s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);box-shadow:0 6px 20px rgba(255,45,85,.3)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:var(--accent-hover);box-shadow:0 6px 20px rgba(59,130,246,.3)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid rgba(255,255,255,.08)}.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.btn-sm{padding:8px 16px;font-size:var(--text-xs);border-radius:8px}
.btn-lg{padding:14px 32px;font-size:var(--text-md)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ── 14. Progress Bars ──────────────────────── */
.progress-bar{width:100%;height:8px;background:var(--bg3);border-radius:999px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s cubic-bezier(.22,1,.36,1)}
.progress-fill.success{background:var(--success)}.progress-fill.warning{background:var(--warning)}.progress-fill.error{background:var(--error)}

/* ── 15. Loading States ─────────────────────── */
.skeleton{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;border-radius:8px;animation:shimmer 1.8s ease-in-out infinite;margin-bottom:var(--space-2);min-height:16px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skeleton-sm{height:12px;width:60%}.skeleton-md{height:20px;width:80%}.skeleton-lg{height:100px;width:100%}

/* ── 16. Error / Empty / Insight ────────────── */
.error-box{display:none;padding:var(--space-3) var(--space-5);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:10px;color:var(--error);font-size:var(--text-base);margin:var(--space-2) 0;line-height:1.5}
.shake{animation:shake .35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.empty-state{text-align:center;padding:var(--space-16) var(--space-5);color:var(--text3)}
.empty-state .emoji{font-size:3.5rem;margin-bottom:var(--space-4);opacity:.35;filter:drop-shadow(0 4px 16px rgba(0,0,0,.3))}
.empty-state h2{font-size:var(--text-xl);font-weight:700;margin-bottom:var(--space-2);color:var(--text2);letter-spacing:-.02em}
.empty-state p{font-size:var(--text-base);color:var(--text3);line-height:1.7;max-width:420px;margin:0 auto}
.insight{background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:var(--radius);padding:22px;margin-bottom:var(--space-4)}
.insight h3{font-size:var(--text-sm);color:var(--accent);margin-bottom:var(--space-2);font-weight:700}
.insight p{color:var(--text2);font-size:var(--text-base);line-height:1.7}

/* ── 17. Auth Pages ─────────────────────────── */
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:var(--space-6);background:var(--bg);position:relative}
.auth-page::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,rgba(255,45,85,.04) 0%,transparent 50%),radial-gradient(ellipse at 70% 80%,rgba(59,130,246,.04) 0%,transparent 50%);pointer-events:none}
.auth-card{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:44px;position:relative;animation:pageIn .4s ease}
.auth-card h1{font-size:var(--text-2xl);margin-bottom:6px;font-weight:800;letter-spacing:-.02em}
.auth-card .subtitle{color:var(--text3);font-size:var(--text-base);margin-bottom:var(--space-8)}
.auth-card .error{color:var(--error);font-size:var(--text-sm);margin-bottom:var(--space-4);padding:12px 16px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius)}

/* ── 18. Forms ──────────────────────────────── */
.form-group{margin-bottom:var(--space-5)}
.form-group label{display:block;font-size:var(--text-xs);font-weight:700;color:var(--text3);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}

/* ── 19. Competitor Grid ────────────────────── */
.competitor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--space-2)}
.competitor-card{padding:var(--space-5);background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.competitor-card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(0,0,0,.2)}
.competitor-card .name{font-weight:700;color:var(--text);margin-bottom:4px;font-size:var(--text-base)}
.competitor-card .note{font-size:var(--text-xs);color:var(--text3);line-height:1.5}
.competitor-card .subs{font-size:var(--text-xs);color:var(--accent);margin-top:var(--space-2);font-weight:600}

/* ── 20. Recommendation List ────────────────── */
.rec-list{list-style:none}
.rec-list li{padding:var(--space-2) 0 var(--space-2) 28px;position:relative;color:var(--text2);font-size:var(--text-base);border-bottom:1px solid var(--border);transition:all .15s;line-height:1.6}
.rec-list li:hover{padding-left:32px;color:var(--text)}
.rec-list li:last-child{border-bottom:none}
.rec-list li::before{content:'\2192';position:absolute;left:0;color:var(--primary);font-weight:700;transition:left .15s}
.rec-list li:hover::before{left:4px}

/* ── 21. Toast ──────────────────────────────── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:var(--space-2);pointer-events:none}
.toast{padding:12px 20px;border-radius:var(--radius);font-size:var(--text-sm);font-weight:500;pointer-events:auto;animation:toastIn .3s cubic-bezier(.16,1,.3,1);max-width:380px;display:flex;align-items:center;gap:10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.5)}
.toast.success{background:rgba(34,197,94,.9);color:#fff}
.toast.error{background:rgba(239,68,68,.9);color:#fff}
.toast.info{background:rgba(59,130,246,.9);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── 22. Badges ─────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.badge-primary{background:rgba(255,45,85,.15);color:var(--primary);border:1px solid rgba(255,45,85,.25)}
.badge-accent{background:rgba(59,130,246,.15);color:var(--accent);border:1px solid rgba(59,130,246,.25)}
.badge-success{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.25)}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warning);border:1px solid rgba(245,158,11,.25)}
.badge-error{background:rgba(239,68,68,.15);color:var(--error);border:1px solid rgba(239,68,68,.25)}

/* ── 23. Scrollbar ──────────────────────────── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px;transition:all .2s}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}

/* ── 24. Responsive — Sidebar < 1024px ─────── */
@media(max-width:1024px){
  .page-content{padding:var(--space-6) var(--space-8)}
}
@media(max-width:900px){
  .chart-grid{grid-template-columns:1fr}
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
  .main-area{margin-left:0}
  .page-content{padding:var(--space-5) var(--space-6)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .menu-toggle{display:flex!important}
  .topbar{padding:0 var(--space-5)}
  .topbar-search{max-width:280px}
  .tabs{overflow-x:auto;flex-wrap:nowrap;gap:0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:11px 16px;white-space:nowrap;flex-shrink:0}
  .stat .value{font-size:1.35rem}
}
@media(max-width:600px){
  .page-content{padding:var(--space-4)}
  .stats{grid-template-columns:1fr 1fr;gap:var(--space-2)}
  .stat{padding:var(--space-3)}
  .stat .value{font-size:1.2rem}
  .stat .label{font-size:var(--text-xs)}
  .card{padding:var(--space-5)}
  .card-header{margin-bottom:var(--space-3)}
  .sidebar-logo{padding:0 var(--space-4)}
  .nav-item{padding:9px 12px;font-size:var(--text-sm)}
  .content-item{padding:12px;flex-wrap:wrap}
  .btn{padding:9px 18px;font-size:.82rem}
  .input{padding:10px 14px;font-size:.85rem}
  .topbar-search{max-width:180px}
  .empty-state{padding:var(--space-10) var(--space-4)}
  .empty-state .emoji{font-size:2.6rem}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr;gap:6px}
  .page-content{padding:var(--space-3)}
  .topbar-search{max-width:130px}
  .topbar-search input{font-size:.82rem}
  .topbar-actions{gap:2px}
  .icon-btn{width:32px;height:32px;font-size:1rem}
  .card{padding:var(--space-4)}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/app.js"></script>
</body>
</html>
