<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Creator Content Radar</title>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#272727;--bg4:#3a3a3a;--text:#f1f1f1;--text2:#aaa;--text3:#717171;--primary:#ff4444;--primary-hover:#ff6666;--accent:#3ea6ff;--success:#2ba640;--warning:#ffa73c;--error:#ff4e45;--border:#303030;--radius:8px;--shadow:0 2px 8px rgba(0,0,0,.4);--sidebar-w:240px;--header-h:56px}
[data-theme=light]{--bg:#fff;--bg2:#f9f9f9;--bg3:#f0f0f0;--bg4:#e5e5e5;--text:#0f0f0f;--text2:#606060;--text3:#909090;--border:#ddd;--shadow:0 1px 3px rgba(0,0,0,.1)}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#root{min-height:100vh}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform .3s}
.sidebar-logo{height:var(--header-h);display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:.95rem;flex-shrink:0}
.sidebar-logo svg{width:24px;height:24px;color:var(--primary)}
.sidebar-logo span{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.nav-section{padding:12px 20px 4px;font-size:.75rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.nav-item{display:flex;align-items:center;gap:16px;padding:10px 20px;color:var(--text2);text-decoration:none;font-size:.9rem;font-weight:500;cursor:pointer;transition:all .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--text);font-weight:600}
.nav-item svg{width:22px;height:22px;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--primary);color:#fff;font-size:.7rem;padding:2px 8px;border-radius:999px;font-weight:600}
.main-area{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:var(--header-h);background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;position:sticky;top:0;z-index:99}
.topbar-search{flex:1;max-width:480px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:0 12px}
.topbar-search input{flex:1;padding:10px 0;background:none;border:none;color:var(--text);font-family:inherit;font-size:.9rem;outline:none}
.topbar-search input::placeholder{color:var(--text3)}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;border:none;background:none;color:var(--text2);cursor:pointer;transition:all .15s;font-size:1.1rem}
.icon-btn:hover{background:var(--bg3);color:var(--text)}
.page-content{padding:24px 32px;flex:1;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-header h2,.card-header h3{font-size:1rem;font-weight:600}
.card-icon{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat .label{font-size:.78rem;color:var(--text3);margin-bottom:4px;text-transform:capitalize}
.stat .value{font-size:1.5rem;font-weight:700}
.stat .change{font-size:.78rem;font-weight:600;margin-top:4px}
.chart-container{position:relative;height:250px;width:100%}
.chart-container-sm{height:180px}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.main-area{margin-left:0}.page-content{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.menu-toggle{display:flex!important}}
.menu-toggle{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:10px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.tab:hover{color:var(--text2)}
.tab.active{color:var(--text);border-bottom-color:var(--primary)}
.tab-count{padding:2px 8px;background:var(--bg3);border-radius:999px;font-size:.7rem;margin-left:6px;color:var(--text2)}
.tab-panel{display:none}.tab-panel.active{display:block;animation:fadeIn .3s ease}
.content-list{display:flex;flex-direction:column;gap:8px}
.content-item{display:flex;gap:12px;padding:12px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;transition:all .15s;cursor:pointer}
.content-item:hover{border-color:var(--text3);transform:translateY(-1px)}
.platform-badge{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;flex-shrink:0}
.tag{display:inline-flex;padding:3px 10px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;font-size:.78rem;color:var(--text2);margin:2px}
.input{width:100%;padding:10px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
.input:focus{border-color:var(--accent)}
.btn{padding:10px 24px;border:none;border-radius:var(--radius);font-weight:600;font-size:.88rem;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{opacity:.9}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg4)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.skeleton{background:var(--bg3);border-radius:6px;animation:pulse 1.5s ease-in-out infinite;margin-bottom:8px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.loading-bar{width:100%;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:8px 0}
.loading-bar.active{display:block}
.loading-bar::after{content:'';display:block;width:40%;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}350%{transform:translateX(350%)}}
.error-box{display:none;padding:10px 14px;background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.25);border-radius:var(--radius);color:var(--error);font-size:.85rem;margin:8px 0}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .emoji{font-size:2.5rem;margin-bottom:8px;opacity:.5}
.insight{background:rgba(62,166,255,.06);border:1px solid rgba(62,166,255,.2);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.insight h3{font-size:.9rem;color:var(--accent);margin-bottom:8px;font-weight:600}
.insight p{color:var(--text2);font-size:.88rem;line-height:1.6}
.auth-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:var(--bg)}
.auth-card{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:32px;box-shadow:var(--shadow)}
.auth-card h1{font-size:1.5rem;margin-bottom:4px}
.auth-card .subtitle{color:var(--text3);font-size:.9rem;margin-bottom:24px}
.auth-card .error{color:var(--error);font-size:.85rem;margin-bottom:12px;padding:8px 12px;background:rgba(255,68,68,.1);border-radius:var(--radius)}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:var(--text2);margin-bottom:6px}
.competitor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.competitor-card{padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s}
.competitor-card:hover{border-color:var(--accent)}
.competitor-card .name{font-weight:600;color:var(--text);margin-bottom:4px}
.competitor-card .note{font-size:.8rem;color:var(--text3)}
.competitor-card .subs{font-size:.78rem;color:var(--accent);margin-top:6px}
.rec-list{list-style:none;}
.rec-list li{padding:8px 0 8px 24px;position:relative;color:var(--text2);font-size:.88rem;border-bottom:1px solid var(--border)}
.rec-list li::before{content:'\2192';position:absolute;left:0;color:var(--primary);font-weight:700}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
</style>
</head>
<body>
<div id="root"></div>
<script src="/static/app.js"></script>
</body>
</html>
