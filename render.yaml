services:
  - type: web
    name: creator-content-radar
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: sh start.sh
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: auto
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        value: creator-content-radar/0.1
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./data/cache.db
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false
      - key: APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # YouTube Analytics API v2 — requires Google OAuth (uses GOOGLE_CLIENT_ID/SECRET above)
      # Scopes are configured in YOUTUBE_ANALYTICS_SCOPES (default: yt-analytics.readonly + youtube.readonly)
      # No separate API key needed — Analytics API uses the OAuth access token from the YouTube connection flow
