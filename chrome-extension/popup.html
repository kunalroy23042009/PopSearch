<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Creator Content Radar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:360px;font-family:-apple-system,system-ui,sans-serif;background:#0f0f0f;color:#f1f1f1;padding:16px}
h1{font-size:1rem;font-weight:700;margin-bottom:4px;background:linear-gradient(135deg,#ff4444,#3ea6ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{font-size:.82rem;color:#aaa;margin-bottom:12px}
.form-group{margin-bottom:12px}
label{display:block;font-size:.78rem;color:#aaa;margin-bottom:4px;font-weight:600}
input{width:100%;padding:8px 12px;background:#272727;border:1px solid #303030;border-radius:6px;color:#f1f1f1;font-size:.85rem;outline:none}
input:focus{border-color:#3ea6ff}
button{width:100%;padding:8px 16px;background:#ff4444;color:#fff;border:none;border-radius:6px;font-weight:600;font-size:.85rem;cursor:pointer;transition:opacity .15s}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.result{display:none;margin-top:12px;padding:12px;background:#1a1a1a;border:1px solid #303030;border-radius:6px;font-size:.82rem;line-height:1.5}
.result .label{color:#717171;font-size:.75rem;text-transform:uppercase;font-weight:600;margin-bottom:4px}
.result .val{color:#f1f1f1;margin-bottom:8px}
.error{display:none;margin-top:12px;padding:8px 12px;background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.25);border-radius:6px;color:#ff4e45;font-size:.8rem}
.loading{display:none;margin-top:12px;text-align:center;color:#717171;font-size:.82rem}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #303030;border-top-color:#ff4444;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
a{color:#3ea6ff;text-decoration:none;font-size:.78rem;display:block;margin-top:8px}
</style>
</head>
<body>
<h1>Creator Content Radar</h1>
<p>Analyze any YouTube channel</p>
<div class="form-group">
<label>YouTube Channel URL or @handle</label>
<input type="text" id="channelUrl" placeholder="e.g. @MrBeast or /channel/UC...">
</div>
<button id="analyzeBtn">Analyze Channel</button>
<div class="loading" id="loading"><span class="spinner"></span>Analyzing...</div>
<div class="error" id="error"></div>
<div class="result" id="result">
<div class="label">Channel</div>
<div class="val" id="rTitle"></div>
<div class="label">Subscribers</div>
<div class="val" id="rSubs"></div>
<div class="label">Niche</div>
<div class="val" id="rNiche"></div>
<div class="label">AI Summary</div>
<div class="val" id="rSummary"></div>
<a id="fullReport" href="#" target="_blank">View full report \u2192</a>
</div>
<script src="popup.js"></script>
</body>
</html>
